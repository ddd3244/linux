# fly.io deployment for the WebSocket-to-TCP proxy.
#
#   fly launch --no-deploy
#   fly deploy -c fly.toml
#
# After deploy, use wss://<app>.fly.dev/ as your relay URL in Settings.

app = "browser-linux-proxy"
primary_region = "iad"

[build]
  dockerfile = "server/proxy/Dockerfile"

[env]
  PORT = "8080"
  MAX_CONNS = "64"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
