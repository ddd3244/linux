    <!--
      GitHub Pages and similar static hosts do not let you set HTTP headers.
      This service worker rewrites responses to include COOP/COEP so that
      SharedArrayBuffer is available and v86 can use the fast path.
      Harmless no-op when proper headers are already set (self-host / Vercel).
    -->
    <script src="./coi-serviceworker.js"></script>
